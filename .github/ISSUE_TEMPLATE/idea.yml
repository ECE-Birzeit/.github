name: Suggest an improvement
description: A new experiment, a clearer explanation, or a missing topic.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Suggestion
      description: What should change, and why would it help students?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Related page
      description: Optional link to the page it concerns.
